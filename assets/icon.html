<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1D1109; }
  body { display: grid; place-items: center; }
  /* 12% safe padding → mark fills the middle 76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
    <!-- eligibility ring: track + cyan arc + drop notch (the motif) -->
    <circle cx="100" cy="100" r="72" fill="none" stroke="#3a2614" stroke-width="22"/>
    <path d="M100 28 A72 72 0 0 1 162.35 136" fill="none" stroke="#56C6E8" stroke-width="22" stroke-linecap="round"/>
    <!-- drop-shaped notch marking the next-eligible tick, at the top -->
    <circle cx="100" cy="28" r="15" fill="#56C6E8"/>
    <path d="M100 8 L112 24 A15 15 0 1 1 88 24 Z" fill="#56C6E8"/>
  </svg>
</body>
</html>
